<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片提取结果（预览）</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="title">图片提取结果</h1>
        <p class="meta" id="meta">正在读取抓取结果…</p>
      </div>
      <div class="topbar-right">
        <label class="field">
          <span>文件名前缀</span>
          <input id="prefix" type="text" placeholder="商品图片" spellcheck="false">
        </label>
        <label class="field">
          <span>并发</span>
          <select id="concurrency">
            <option value="2">2</option>
            <option value="4" selected>4</option>
            <option value="6">6</option>
            <option value="8">8</option>
          </select>
        </label>
        <button id="download" class="btn primary" disabled>下载选中 (0)</button>
      </div>
    </header>

    <section class="toolbar">
      <div class="toolbar-left">
        <button class="chip" id="select-all">全选</button>
        <button class="chip" id="invert">反选</button>
        <button class="chip" id="select-none">清空选择</button>
        <span class="sep"></span>
        <span class="inline">
          <input id="first-count" class="num" type="number" min="1" value="20">
          <button class="chip" id="select-first">选前 N 张</button>
        </span>
        <span class="sep"></span>
        <select id="filter-host" class="select" title="按图床域名筛选">
          <option value="all">全部域名</option>
        </select>
        <select id="filter-size" class="select" title="按尺寸筛选">
          <option value="0">不限尺寸</option>
          <option value="400">≥ 400px</option>
          <option value="800">≥ 800px</option>
          <option value="1200">≥ 1200px</option>
        </select>
        <input id="search" class="search" type="search" placeholder="按链接关键字筛选" spellcheck="false">
      </div>
      <div class="toolbar-right">
        <label class="switch" title="自动隐藏加载后真实尺寸过小的图片（角标、图标、按钮等）">
          <input type="checkbox" id="hide-small">
          <span>隐藏小图</span>
        </label>
        <label class="switch" title="下次抓取前先自动滚动到底，触发懒加载">
          <input type="checkbox" id="auto-scroll">
          <span>抓取前自动滚动加载</span>
        </label>
        <span id="stats"></span>
      </div>
    </section>

    <section id="progress" class="progress" hidden>
      <div class="progress-head">
        <span id="progress-text">准备中…</span>
        <span id="progress-size"></span>
      </div>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
      <div id="failures" class="failures" hidden>
        <div class="failures-head">
          <strong id="failure-title">失败项</strong>
          <button class="chip" id="retry">重试失败项</button>
        </div>
        <ul id="failure-list"></ul>
      </div>
    </section>

    <main id="grid" class="grid"></main>

    <div id="empty" class="empty" hidden>
      <p class="empty-title">没有可下载的图片</p>
      <p class="empty-sub">可能原因：当前页面不是商品详情页、图片需要滚动才会加载、或图片域名不在扩展授权范围内。</p>
    </div>

    <footer class="footer">
      单击卡片选中 / 取消，双击卡片或点右下角放大镜查看大图。所有图片统一转换为 PNG 后保存，体积通常大于原图。
    </footer>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" id="lb-close" title="关闭（Esc）" type="button">✕</button>
    <button class="lb-nav lb-prev" id="lb-prev" title="上一张（←）" type="button">‹</button>
    <button class="lb-nav lb-next" id="lb-next" title="下一张（→）" type="button">›</button>
    <figure class="lb-figure">
      <img id="lb-img" alt="">
      <figcaption>
        <span id="lb-index" class="lb-index"></span>
        <span id="lb-info" class="lb-info"></span>
        <span class="lb-actions">
          <button class="chip" id="lb-select" type="button">选中</button>
          <button class="chip" id="lb-download" type="button">下载这一张</button>
          <a id="lb-original" class="chip" href="#" target="_blank" rel="noreferrer">打开原图</a>
        </span>
      </figcaption>
    </figure>
  </div>

  <!-- 预览用桩数据：模拟 chrome.* API 与一份抓取结果，仅 preview.html 使用（不参与扩展运行） -->
  <script>
    (function () {
      function tile(label, w, h, tone) {
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
          '<defs><linearGradient id="g" x1="0" y1="0" x2="0.6" y2="1">' +
          '<stop offset="0" stop-color="' + tone + '"/><stop offset="1" stop-color="#ffffff"/>' +
          '</linearGradient></defs>' +
          '<rect width="100%" height="100%" fill="url(#g)"/>' +
          '<circle cx="' + (w * 0.7) + '" cy="' + (h * 0.3) + '" r="' + (Math.min(w, h) * 0.18) + '" fill="rgba(255,255,255,.7)"/>' +
          '<text x="50%" y="73%" font-size="' + Math.round(Math.min(w, h) / 7) + '" fill="#4a5058" text-anchor="middle" font-family="sans-serif">' + label + '</text>' +
          '</svg>';
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
      }
      const tones = ['#ffd8c2', '#cfe4ff', '#d8f2dd', '#ffe6b8'];
      const shapes = [[800, 800], [750, 1000], [1000, 1000], [750, 1226], [800, 800], [1200, 1200],
        [750, 900], [1000, 1334], [800, 800], [900, 1200], [750, 1000], [1000, 1000]];
      const items = shapes.map(function (s, i) {
        return {
          id: 'i' + i, index: i, url: tile('#' + (i + 1), s[0], s[1], tones[i % tones.length]),
          host: i % 4 === 3 ? 'img10.360buyimg.com' : 'img.alicdn.com',
          width: s[0], height: s[1], source: 'img', ext: 'jpg'
        };
      });
      const collection = {
        id: 'demo', createdAt: Date.now(),
        pageTitle: '2026 春季新款纯棉宽松长袖衬衫 男士商务休闲免烫衬衣',
        pageUrl: 'https://item.taobao.com/item.htm?id=123456789',
        platform: 'taobao', platformName: '淘宝 / 天猫',
        referer: 'https://item.taobao.com/', frames: 3, items: items, stats: {}
      };
      const sessionStore = { 'eig:lastCollectionId': 'demo', 'eig:collection:demo': collection };
      const settings = { 'eig:settings': { prefix: '春季新款衬衫', concurrency: 4, autoScroll: true } };

      window.chrome = {
        storage: {
          session: {
            get: async function (keys) {
              if (keys === null || keys === undefined) return Object.assign({}, sessionStore);
              const list = Array.isArray(keys) ? keys : [keys];
              const out = {};
              list.forEach(function (k) { if (k in sessionStore) out[k] = sessionStore[k]; });
              return out;
            },
            set: async function () {}
          },
          local: {
            get: async function (keys) {
              const list = Array.isArray(keys) ? keys : [keys];
              const out = {};
              list.forEach(function (k) { if (k in settings) out[k] = settings[k]; });
              return out;
            },
            set: async function () {}
          },
          onChanged: { addListener: function () {} }
        },
        runtime: {
          sendMessage: async function () { return { ok: false, error: '预览模式' }; },
          onMessage: { addListener: function () {} }
        },
        downloads: {
          download: async function () { return 1; },
          onChanged: { addListener: function () {}, removeListener: function () {} }
        }
      };

      // #selected：预置"全选 + 下载进度"状态；#lightbox：预置大图预览状态
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (location.hash === '#selected' || location.hash === '#lightbox') {
            document.getElementById('select-all').click();
          }
          if (location.hash === '#selected') {
            const panel = document.getElementById('progress');
            panel.hidden = false;
            document.getElementById('bar-fill').style.width = '65%';
            document.getElementById('progress-text').textContent = '已完成 8 / 12 · 成功 7 · 失败 1';
            document.getElementById('progress-size').textContent = '已保存约 24.6 MB';
            const fails = document.getElementById('failures');
            fails.hidden = false;
            document.getElementById('failure-title').textContent = '失败项（1）';
            document.getElementById('failure-list').innerHTML =
              '<li><span class="f-url">O1CN01detail_9.jpg</span><span class="f-reason">下载中断：SERVER_FORBIDDEN</span></li>';
          }
          if (location.hash === '#lightbox') {
            const card = document.querySelector('.card');
            card.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
          }
        }, 300);
      });
    })();
  </script>
  <script src="../shared/utils.js"></script>
  <script src="../shared/url-utils.js"></script>
  <script src="../shared/platforms.js"></script>
  <script src="../shared/image-to-png.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
